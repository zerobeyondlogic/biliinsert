<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>B站属地补全</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30" fill="none"><path d="M24 13.5C24 20 16 26 16 26S8 20 8 13.5a8 8 0 0 1 16 0Z" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="13.5" r="2.7" stroke="currentColor" stroke-width="2.2"/></svg>
        </div>
        <div><h1>B站属地补全</h1><p class="subtitle">属地与关注时间，一起补全</p></div>
        <span id="version" class="version"></span>
      </header>

      <section class="card" aria-labelledby="display-heading">
        <h2 id="display-heading">显示位置</h2>
        <label class="setting-row" for="comments-toggle">
          <span><span class="setting-name">评论区与楼中楼</span><span class="setting-description">直接显示，无需额外授权</span></span>
          <input id="comments-toggle" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span>
        </label>
        <div class="divider"></div>
        <label class="setting-row" for="profile-toggle">
          <span><span class="setting-name">个人主页</span><span class="setting-description">在用户名旁显示主页属地</span></span>
          <input id="profile-toggle" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span>
        </label>
        <div class="divider"></div>
        <label class="setting-row" for="dynamic-toggle">
          <span><span class="setting-name">每条动态</span><span class="setting-description">列表、详情与转发分别显示</span></span>
          <input id="dynamic-toggle" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span>
        </label>
        <div class="divider"></div>
        <label class="setting-row" for="subscribe-time-toggle">
          <span><span class="setting-name">关注时间</span><span class="setting-description">主页与关注 / 粉丝列表，使用网页登录</span></span>
          <input id="subscribe-time-toggle" type="checkbox" role="switch" checked><span class="switch" aria-hidden="true"></span>
        </label>
      </section>

      <section class="card authorization" aria-labelledby="auth-heading">
        <div class="section-heading"><h2 id="auth-heading">主页与动态查询</h2><span id="auth-state" class="status" data-state="loading">检查中</span></div>
        <p id="auth-description" class="description">评论和关注时间可直接使用。个人主页与动态属地需要用 B站 App 扫码授权一次。</p>
        <button id="authorize-button" type="button" class="primary" disabled>扫码授权</button>
        <button id="clear-button" type="button" class="text-button" hidden>清除本地授权</button>

        <div id="qr-panel" class="qr-panel" hidden>
          <div class="qr-frame"><canvas id="qr-code" width="224" height="224" aria-label="B站登录授权二维码" role="img"></canvas></div>
          <p id="qr-status" class="qr-status" role="status">正在生成二维码…</p>
          <p class="qr-help">使用哔哩哔哩手机 App 扫码<br>核对设备登录提示后，在手机上确认</p>
          <button id="cancel-button" type="button" class="text-button">取消本次扫码</button>
        </div>
        <p class="privacy-note">网页登录目前不能可靠完成此授权，不必退出网页登录。扫码会创建设备登录凭据，仅保存在本机扩展中。</p>
      </section>

      <div id="message" class="message" role="status" aria-live="polite" hidden></div>

      <section class="help" aria-labelledby="help-heading">
        <h2 id="help-heading">使用提示</h2>
        <p>首次授权后，刷新已打开的 B站页面。B站没有返回属地的内容不会显示标签。</p>
        <p>已内置评论区和楼中楼属地。主页属地与每条内容发表时的属地可能不同。</p>
      </section>
      <footer>仅显示 B站返回的属地 · 不推测位置</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
